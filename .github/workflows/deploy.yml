# Met à jour Modal (s'il le faut) puis le VPS à chaque push sur master. Refusé pendant un run :
# à relancer ensuite depuis l'onglet Actions, ou avec gh workflow run deploy.yml.
# Mise en place : deploy/setup_github_actions.sh
name: Déploiement

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Toujours le dernier master : une relance déploie l'état actuel, pas un commit ancien.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
          bash -n deploy/update_vps.sh

      - name: Préparer SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Contrôler le VPS (aucun run en cours)
        id: vps
        run: |
          commit=$(ssh "${{ secrets.VPS_TARGET }}" check)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # Comparé au commit du VPS, pas au dernier push : le VPS n'avance qu'après Modal, donc un
      # changement dont le déploiement a été refusé (run en cours) est repris à la relance.
      - name: Déployer sur Modal si besoin
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if git diff --quiet "${{ steps.vps.outputs.commit }}" HEAD -- \
              model_training_pipeline/encoders.py model_training_pipeline/embed_modal.py; then
            echo "encoders.py et embed_modal.py inchangés : pas de déploiement Modal."
          else
            pip install --quiet modal==1.6.3
            modal deploy model_training_pipeline/embed_modal.py
          fi

      - name: Mettre à jour le VPS
        run: ssh "${{ secrets.VPS_TARGET }}" update
