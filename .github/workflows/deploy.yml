# Met à jour Modal (s'il le faut) puis le VPS à chaque push sur master, et toutes les heures pour
# reprendre ce qu'un run a retardé : rien n'est déployé tant qu'un run tourne.
# Mise en place : deploy/setup_github_actions.sh
name: Déploiement

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Toujours le dernier master : une relance déploie l'état actuel, pas un commit ancien.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Préparer SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Contrôler le VPS
        id: vps
        run: |
          state=$(ssh "${{ secrets.VPS_TARGET }}" check)
          if [ "$state" = running ]; then
            echo "::notice::Run en cours : rien n'est déployé, nouvel essai à la prochaine heure."
          elif [ "$state" = "$(git rev-parse HEAD)" ]; then
            echo "::notice::VPS déjà à jour."
          else
            echo "commit=$state" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.vps.outputs.commit
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe
        if: steps.vps.outputs.commit
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
          bash -n deploy/update_vps.sh

      # Comparé au commit du VPS, pas au dernier push : le VPS n'avance qu'après Modal, donc un
      # changement retardé par un run est repris au déploiement suivant.
      - name: Déployer sur Modal si besoin
        if: steps.vps.outputs.commit
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          base="${{ steps.vps.outputs.commit }}"
          if git diff --quiet "$base" HEAD -- model_training_pipeline/encoders.py model_training_pipeline/embed_modal.py; then
            echo "encoders.py et embed_modal.py inchangés : app des embeddings non redéployée."
          else
            pip install --quiet modal==1.6.3
            modal deploy model_training_pipeline/embed_modal.py
          fi
          # Entraînement sur GPU (TRAIN_GPU=modal) : train_modal.py et le calcul qu'il embarque
          if git diff --quiet "$base" HEAD -- model_training_pipeline/train_modal.py model_training_pipeline/train_torch.py; then
            echo "train_modal.py et train_torch.py inchangés : app d'entraînement non redéployée."
          else
            pip install --quiet modal==1.6.3
            modal deploy model_training_pipeline/train_modal.py
          fi

      - name: Mettre à jour le VPS
        if: steps.vps.outputs.commit
        run: ssh "${{ secrets.VPS_TARGET }}" update
