[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "00_edit_generator"
version = "0.1.0"
description = "Génère des vidéos annotées (overlays de montage ajoutés sur des clips Pixabay) pour entraîner/évaluer un agent d'extraction."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
agent = ["mistralai>=3.3"]
# torch : installer la variante CUDA depuis https://download.pytorch.org/whl/cu126
model_training_pipeline = ["torch", "transformers", "scikit-learn", "numpy"]

[project.scripts]
edit_generator = "edit_generator.cli:main"

[tool.setuptools]
packages = ["edit_generator", "model_training_pipeline", "agents"]
# Un nom de module ne peut pas commencer par un chiffre : le paquet s'importe sous le nom
# edit_generator mais vit dans le dossier 00_edit_generator (préfixe pour l'ordre des dossiers).
# Conséquence : il faut l'installer (pip install -e .) pour que l'import fonctionne.
package-dir = {"edit_generator" = "00_edit_generator"}
