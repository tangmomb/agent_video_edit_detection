[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "00_video_source"
version = "0.2.0"
description = "Classifieur « l'image contient un ajout de montage » entraîné sur de vraies vidéos YouTube annotées par trois LLM de vision."
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
    "yt-dlp>=2026.10",
    # annotateurs (video_source/annotators.py) et banc utils/llm_bench
    "mistralai>=3.3",
    "openai>=3.0",
    "anthropic>=2.0",
]

[project.optional-dependencies]
# torch : installer la variante CUDA depuis https://download.pytorch.org/whl/cu126
model_training_pipeline = ["torch", "transformers", "scikit-learn", "numpy"]

[project.scripts]
video_source = "video_source.cli:main"

[tool.setuptools]
packages = ["video_source", "model_training_pipeline", "agents"]
# Un nom de module ne peut pas commencer par un chiffre : le paquet s'importe sous le nom
# video_source mais vit dans le dossier 00_video_source (préfixe pour l'ordre des dossiers).
# Conséquence : il faut l'installer (pip install -e .) pour que l'import fonctionne.
package-dir = {"video_source" = "00_video_source"}
